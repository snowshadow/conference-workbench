<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc"><title id="title">会议工作台功能流程</title><desc id="desc">现场录音或导入音视频，保存录音并转录，组织澄清焦点和讨论脉络，人工核对后保存纪要。原文依据贯穿全过程，ASR 和大模型按配置独立运行。</desc><rect width="1440" height="470" rx="24" fill="#f1f6f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="54" y="65" fill="#233d4f" font-size="27" font-weight="600">从原话，到共同的理解</text><text x="54" y="102" fill="#627780" font-size="17">录音保存、语音识别和 AI 分析分别记录状态；重要结果由人核对。</text><rect x="54" y="145" width="290" height="214" rx="18" fill="white" stroke="#d6e5e6"/><text x="77" y="181" fill="#05afb5" font-size="16" font-weight="600">01</text><text x="77" y="219" fill="#233d4f" font-size="26" font-weight="600">留住现场</text><text x="77" y="259" fill="#506974" font-size="18">实时录音</text><text x="77" y="289" fill="#506974" font-size="18">或导入音视频</text><text x="77" y="333" fill="#718891" font-size="14">音频保存在本机</text><path d="M358 248h26m-7-7 7 7-7 7" fill="none" stroke="#6c999e" stroke-width="2"/><rect x="401" y="145" width="290" height="214" rx="18" fill="white" stroke="#d6e5e6"/><text x="424" y="181" fill="#05afb5" font-size="16" font-weight="600">02</text><text x="424" y="219" fill="#233d4f" font-size="26" font-weight="600">找到原话</text><text x="424" y="259" fill="#506974" font-size="18">转录 · 搜索 · 说话人</text><text x="424" y="289" fill="#506974" font-size="18">引用定位与区间回听</text><text x="424" y="333" fill="#718891" font-size="14">ASR 按服务配置运行</text><path d="M705 248h26m-7-7 7 7-7 7" fill="none" stroke="#6c999e" stroke-width="2"/><rect x="748" y="145" width="290" height="214" rx="18" fill="white" stroke="#d6e5e6"/><text x="771" y="181" fill="#05afb5" font-size="16" font-weight="600">03</text><text x="771" y="219" fill="#233d4f" font-size="26" font-weight="600">看清讨论</text><text x="771" y="259" fill="#506974" font-size="18">澄清焦点 · 会后复盘</text><text x="771" y="289" fill="#506974" font-size="18">主题 · 决定 · 行动项</text><text x="771" y="333" fill="#718891" font-size="14">LLM 解释与组织</text><path d="M1052 248h26m-7-7 7 7-7 7" fill="none" stroke="#6c999e" stroke-width="2"/><rect x="1095" y="145" width="290" height="214" rx="18" fill="white" stroke="#d6e5e6"/><text x="1118" y="181" fill="#05afb5" font-size="16" font-weight="600">04</text><text x="1118" y="219" fill="#233d4f" font-size="26" font-weight="600">记下进展</text><text x="1118" y="259" fill="#506974" font-size="18">核对 · 修正 · 补充</text><text x="1118" y="289" fill="#506974" font-size="18">纪要编辑与 Markdown 导出</text><text x="1118" y="333" fill="#718891" font-size="14">人工记录受到保护</text><path d="M420 386H1340" stroke="#8cbbbb" stroke-width="2" stroke-dasharray="5 5"/><text x="54" y="415" fill="#466d74" font-size="17">原文与来源版本贯穿整理过程</text><text x="838" y="424" fill="#73888e" font-size="15">浏览器工作台与 MCP Agent 共用业务 API</text></g></svg>